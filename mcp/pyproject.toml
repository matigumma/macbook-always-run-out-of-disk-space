[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diskclean-mcp"
version = "0.1.0"
description = "MCP server for diskclean.sh — agent-driven Mac disk cleanup"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mati Gummá" }]
keywords = ["mcp", "model-context-protocol", "macos", "disk-cleanup", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "mcp>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/matigumma/macbook-always-run-out-of-disk-space"
Issues = "https://github.com/matigumma/macbook-always-run-out-of-disk-space/issues"

[project.scripts]
diskclean-mcp = "diskclean_mcp.server:main"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diskclean_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "hatch_build.py"]
